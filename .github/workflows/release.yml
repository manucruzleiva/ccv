name: Release

on:
  push:
    tags:
      - 'v*'
  # PRs that touch packaging get a full build (no publish) so a broken
  # installer or zip is caught before a tag is pushed.
  pull_request:
    paths:
      - 'ccv.py'
      - 'requirements.txt'
      - 'installer/**'
      - '.github/workflows/release.yml'
  # Manual run from the Actions tab (or the API). With publish=true on
  # main it tags the commit as v<APP_VERSION> and publishes the release,
  # so cutting a release doesn't need anyone to push a tag by hand.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Tag main as v<APP_VERSION> and publish the release (off = build only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          $ver = (python ccv.py --version).Trim()
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Unexpected APP_VERSION '$ver'"; exit 1 }
          $tag = "v$ver"
          $publish = 'false'
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            if ($tag -ne $env:GITHUB_REF_NAME) {
              Write-Error "Tag $($env:GITHUB_REF_NAME) does not match APP_VERSION $ver in ccv.py"
              exit 1
            }
            $publish = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:PUBLISH_INPUT -eq 'true') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              Write-Error "Publishing is only allowed from main (got $($env:GITHUB_REF))"
              exit 1
            }
            if (git ls-remote --tags origin "refs/tags/$tag") {
              Write-Error "$tag already exists: bump APP_VERSION before publishing again"
              exit 1
            }
            $publish = 'true'
          }
          Write-Output "tag=$tag publish=$publish"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.11,<7"

      - name: Download ffmpeg / ffplay / ffprobe (BtbN GPL build)
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Output "ffmpeg zip sha256: $((Get-FileHash $zip -Algorithm SHA256).Hash)"
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $extracted = Get-ChildItem $env:RUNNER_TEMP -Directory | Where-Object Name -Like 'ffmpeg-*-win64-gpl' | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item -Force (Join-Path $extracted.FullName 'bin\ffmpeg.exe')  bin\
          Copy-Item -Force (Join-Path $extracted.FullName 'bin\ffplay.exe')  bin\
          Copy-Item -Force (Join-Path $extracted.FullName 'bin\ffprobe.exe') bin\
          Get-ChildItem bin\ | Format-Table Name, Length
          & bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Build ccv.exe (single-file portable)
        run: python ccv.py build

      - name: Build ccv/ folder (onedir, used by the zip and the installer)
        run: python ccv.py build --onedir

      - name: Verify build output
        shell: pwsh
        run: |
          foreach ($p in @('ccv.exe', 'ccv\ccv.exe', 'ccv\_internal')) {
            if (-not (Test-Path $p)) { Write-Error "$p was not produced"; exit 1 }
          }
          $sizeMB = [math]::Round((Get-Item ccv.exe).Length / 1MB, 1)
          Write-Output "ccv.exe size: $sizeMB MB"
          if ($sizeMB -lt 50) {
            Write-Error "ccv.exe is suspiciously small ($sizeMB MB) — bundled ffmpeg likely missing"
            exit 1
          }
          if (-not (Get-ChildItem ccv\_internal -Recurse -Filter ffplay.exe)) {
            Write-Error 'ffplay.exe missing from the onedir build'
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { Write-Error 'ISCC.exe not found after install'; exit 1 }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package portable zip, installer and checksums
        shell: pwsh
        run: |
          $ver = (python ccv.py --version).Trim()
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Portable zip: the onedir folder + the marker that keeps the
          # config next to the exe instead of in the user's profile.
          $stage = Join-Path $env:RUNNER_TEMP 'portable'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          Copy-Item -Recurse ccv $stage
          Set-Content -Path (Join-Path $stage 'ccv.portable') -Encoding ascii -Value @(
            'This file makes CCV run in portable mode: settings are stored in ccv.json',
            'next to ccv.exe instead of in your user profile. Delete it to use the profile.'
          )
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath dist\ccv-portable.zip -CompressionLevel Optimal

          Copy-Item ccv.exe dist\ccv.exe

          & $env:ISCC "/DAppVersion=$ver" "/DSourceDir=$PWD\ccv" "/DOutputDir=$PWD\dist" installer\ccv.iss
          if ($LASTEXITCODE -ne 0) { Write-Error 'ISCC failed'; exit 1 }

          # sha256sum-compatible manifest; the in-app updater refuses any
          # download whose hash doesn't match this file.
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist\SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, @{n='MB'; e={[math]::Round($_.Length / 1MB, 1)}}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccv-dist
          path: dist/*
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ccv-dist
          path: dist

      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          tag="${TAG}"                      # e.g. v0.7.0
          ver="${tag#v}"                    # e.g. 0.7.0
          # Write the matching CHANGELOG section straight to a file.
          # Avoids round-tripping the body through Actions expression
          # interpolation in a later run-step: the body contains
          # backticks (markdown code) that bash would otherwise try to
          # execute as command substitutions.
          awk -v ver="$ver" '
            $0 ~ ("^## \\[" ver "\\]")     { capture = 1; next }
            capture && /^## \[/            { exit }
            capture                        { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s. See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' \
              "$tag" "${{ github.repository }}" > release-notes.md
          fi
          echo "----- release notes preview -----"
          cat release-notes.md
          echo "----- end -----"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # --target creates the tag on this commit when the run came from
          # workflow_dispatch; on a tag push the tag already exists there.
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --repo "${{ github.repository }}" \
            --title "CCV $tag" \
            --notes-file release-notes.md
